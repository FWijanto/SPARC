[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SPARC"
version = "0.1.0"
description = "SPARC: gene-program-aware survival modelling from H&E whole-slide images."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-4.0" }
authors = [
    { name = "Aziz Ayed", email = "aziz.ayed@hec.edu" },
    { name = "Gabrielle Cohn", email = "gcohn@mit.edu" },
    { name = "et al." },
]
keywords = ["computational-pathology", "survival-analysis", "WSI", "TCGA",
            "gene-expression-programs", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Pinned minimums match what the paper experiments were run with.

dependencies = [
    "torch==2.10.0",
    "triton==3.6.0+rocm7.2.4.git4ed88892 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "numpy>=1.24",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "scikit-learn>=1.3",
    "scikit-survival>=0.21",
    "scipy>=1.11",
    "h5py>=3.9",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "lifelines>=0.27",
    "opencv-python>=4.8",
    "openslide-python>=1.3",
    "Pillow>=10.0",
    "tifffile>=2023.9",
    "zarr>=2.16,<3",
    "geopandas>=0.14",
    "huggingface-hub>=0.20",
    "transformers>=4.36",
    "timm==0.9.16",
    "einops-exts>=0.0.4",
    "segmentation-models-pytorch>=0.3.3",
]

[project.optional-dependencies]
# WSI handling with the Python bindings only. Assumes libopenslide is
# already provided by the system (e.g. `pacman -S openslide` on Arch).
wsi = [
    "trident @ git+https://github.com/mahmoodlab/TRIDENT.git@2daba084238f72b8f207fb0b5fe25e44637a6b5c",
    "openslide-python>=1.3",
    "pylibCZIrw>=4.0",
    "Pillow>=10.0",
]

# Notebooks + dev tools
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.25",
    "nbconvert>=7.0",
    "pytest>=7.4",
]

[project.scripts]
sparc-train = "train:main"
sparc-inference = "inference.run:main"
sparc-pipeline = "preprocessing.pipeline:main"

[tool.setuptools]
py-modules = ["train"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sparc*", "inference*", "analysis*", "preprocessing*"]

# --- uv-specific configuration -------------------------------------------

# Get torch wheels from AMD's repos for compile compatibility.
[tool.uv]
find-links = [
  "https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2.4/",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: opt-in GPU test using external WSI and checkpoints"]
